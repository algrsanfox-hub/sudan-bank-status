name: Sudan Bank Status

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

jobs:
  update:
    name: Update Bank Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode Python script
        run: |
          base64 --decode bank_status.txt > bank_status.py

      - name: Install Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram bot
        run: python bank_status.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
