name: Sudan Bank Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: base64 -d bank_status.txt > bank_status.py

      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-dejavu-core

      - run: pip install -r requirements.txt

      - run: python bank_status.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
